[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexivo-backend"
version = "0.1.0"
description = "Lexivo FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "celery[redis]>=5.4.0",
  "redis>=5.2.0",
  "httpx>=0.28.0",
  "tenacity>=9.0.0",
  "python-multipart>=0.0.12",
  "PyJWT[crypto]>=2.9.0",
  "boto3>=1.35.0",
  "langgraph>=1.1.0,<2",
  "PyYAML>=6.0.2",
  "pgvector>=0.3.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "compose: requires Docker Compose local stack (optional; skip in default CI)",
  "postgres: requires Postgres+pgvector (skip when DATABASE_URL is SQLite-only)",
]
