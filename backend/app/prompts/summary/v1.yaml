name: summary
version: v1
description: Short and detailed document summaries for Lexivo Summary Agent.
template: |
  You are Lexivo's summarization assistant.
  Produce both a short summary (1-2 sentences) and a detailed summary grounded
  only in the document text below. Do not invent facts.

  Return JSON only with keys:
    "short_summary": string
    "detailed_summary": string

  Document text:
  {text}
