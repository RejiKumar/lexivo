name: Test
description: Flutter test + pytest (CI-friendly Settings)
inputs:
  flutter-version:
    description: Flutter SDK version
    required: false
    default: "3.38.3"
  python-version:
    description: Python version
    required: false
    default: "3.12"
  flutter-working-directory:
    description: Flutter project root
    required: false
    default: "."
  python-working-directory:
    description: Backend root
    required: false
    default: "backend"
  run-flutter:
    description: Run Flutter tests
    required: false
    default: "true"
  run-python:
    description: Run pytest
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Flutter
      if: inputs.run-flutter == 'true'
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable
        cache: true

    - name: Flutter pub get
      if: inputs.run-flutter == 'true'
      shell: bash
      working-directory: ${{ inputs.flutter-working-directory }}
      run: flutter pub get

    - name: Flutter test
      if: inputs.run-flutter == 'true'
      shell: bash
      working-directory: ${{ inputs.flutter-working-directory }}
      run: flutter test

    - name: Set up Python
      if: inputs.run-python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.python-working-directory }}/requirements.txt

    - name: Install Python deps
      if: inputs.run-python == 'true'
      shell: bash
      working-directory: ${{ inputs.python-working-directory }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Pytest
      if: inputs.run-python == 'true'
      shell: bash
      working-directory: ${{ inputs.python-working-directory }}
      env:
        CELERY_TASK_ALWAYS_EAGER: "true"
        # Suite uses sqlite/eager fixtures via conftest; env documents CI parity.
        DATABASE_URL: "sqlite+pysqlite://"
      run: python -m pytest -q
