name: Lint
description: Flutter analyze + Python lint (ruff / compileall fallback)
inputs:
  flutter-version:
    description: Flutter SDK version (channel/version string for setup-flutter)
    required: false
    default: "3.38.3"
  python-version:
    description: Python version
    required: false
    default: "3.12"
  flutter-working-directory:
    description: Flutter project root
    required: false
    default: "."
  python-working-directory:
    description: Backend root
    required: false
    default: "backend"
  run-flutter:
    description: Run Flutter analyze
    required: false
    default: "true"
  run-python:
    description: Run Python lint
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Flutter
      if: inputs.run-flutter == 'true'
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable
        cache: true

    - name: Flutter pub get
      if: inputs.run-flutter == 'true'
      shell: bash
      working-directory: ${{ inputs.flutter-working-directory }}
      run: flutter pub get

    - name: Flutter analyze
      if: inputs.run-flutter == 'true'
      shell: bash
      working-directory: ${{ inputs.flutter-working-directory }}
      # Failures = analyzer errors/warnings; infos follow analysis_options.yaml.
      run: flutter analyze

    - name: Set up Python
      if: inputs.run-python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.python-working-directory }}/requirements.txt

    - name: Install Python deps + ruff
      if: inputs.run-python == 'true'
      shell: bash
      working-directory: ${{ inputs.python-working-directory }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install "ruff>=0.8.0"

    - name: Ruff check
      if: inputs.run-python == 'true'
      shell: bash
      working-directory: ${{ inputs.python-working-directory }}
      run: ruff check app tests scripts
