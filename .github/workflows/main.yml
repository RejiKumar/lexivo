name: Main

on:
  push:
    branches: [main]

concurrency:
  group: main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lexivo-backend

jobs:
  lint-flutter:
    name: lint-flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lint
        with:
          run-flutter: "true"
          run-python: "false"

  lint-python:
    name: lint-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lint
        with:
          run-flutter: "false"
          run-python: "true"

  test-flutter:
    name: test-flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test
        with:
          run-flutter: "true"
          run-python: "false"

  test-python:
    name: test-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test
        with:
          run-flutter: "false"
          run-python: "true"

  openapi-snapshot:
    name: openapi-snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check OpenAPI snapshot
        run: |
          chmod +x tool/check_openapi_snapshot.sh
          ./tool/check_openapi_snapshot.sh

  build-backend-image:
    name: build-backend-image
    runs-on: ubuntu-latest
    needs: [lint-python, test-python, openapi-snapshot]
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Image metadata
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG="${GITHUB_SHA}"
          echo "image=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
      - name: Build backend image
        uses: ./.github/actions/build
        with:
          target: backend-image
          image-name: ${{ env.IMAGE }}
          image-tag: ${{ env.TAG }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push
        run: |
          docker tag "${IMAGE}:${TAG}" "${IMAGE}:staging"
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:staging"

  build-web:
    name: build-web
    runs-on: ubuntu-latest
    needs: [lint-flutter, test-flutter]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Build Flutter web
        uses: ./.github/actions/build
        with:
          target: web
          api-base-url: ${{ vars.API_BASE_URL || 'http://localhost:8000' }}
          supabase-url: ${{ vars.SUPABASE_URL || '' }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY || '' }}
          sentry-dsn: ${{ secrets.SENTRY_DSN || '' }}
          posthog-api-key: ${{ secrets.POSTHOG_API_KEY || '' }}
          posthog-host: ${{ vars.POSTHOG_HOST || '' }}
          subscription-paywall-enabled: ${{ vars.SUBSCRIPTION_PAYWALL_ENABLED || 'false' }}
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: build/web

  build-android-apk:
    name: build-android-apk
    runs-on: ubuntu-latest
    needs: [lint-flutter, test-flutter]
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        uses: ./.github/actions/build
        with:
          target: android-apk
          api-base-url: ${{ vars.API_BASE_URL || 'http://localhost:8000' }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-android-aab:
    name: build-android-aab
    runs-on: ubuntu-latest
    needs: [lint-flutter, test-flutter]
    steps:
      - uses: actions/checkout@v4
      - name: Build AAB
        uses: ./.github/actions/build
        with:
          target: android-aab
          api-base-url: ${{ vars.API_BASE_URL || 'http://localhost:8000' }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  deploy-staging-backend:
    name: deploy-staging-backend
    runs-on: ubuntu-latest
    needs: [build-backend-image]
    environment: staging
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Cloud Run
        uses: ./.github/actions/deploy-cloud-run
        with:
          environment: staging
          image: ${{ needs.build-backend-image.outputs.image }}
          service-name: ${{ vars.CLOUD_RUN_API_SERVICE }}
          worker-service-name: ${{ vars.CLOUD_RUN_WORKER_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          project-id: ${{ vars.GCP_PROJECT_ID }}
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          credentials-json: ${{ secrets.GCP_SA_KEY }}
          env-vars: >-
            DATABASE_URL=${{ secrets.DATABASE_URL }},
            REDIS_URL=${{ secrets.REDIS_URL }},
            CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }},
            SUPABASE_URL=${{ secrets.SUPABASE_URL }},
            SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }},
            SENTRY_DSN=${{ secrets.SENTRY_DSN }},
            POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }},
            POSTHOG_HOST=${{ vars.POSTHOG_HOST }},
            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }},
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }},
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }},
            R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }},
            R2_ENDPOINT_URL=${{ secrets.R2_ENDPOINT_URL }},
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},
            MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}

  deploy-staging-web:
    name: deploy-staging-web
    runs-on: ubuntu-latest
    needs: [build-web]
    environment: staging
    if: ${{ vars.CLOUDFLARE_PAGES_PROJECT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flutter-web
          path: build/web
      - name: Deploy Cloudflare Pages
        uses: ./.github/actions/deploy-cloudflare-pages
        with:
          environment: staging
          dist-path: build/web
          project-name: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          branch: main
