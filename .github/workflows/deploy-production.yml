name: Deploy production

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: production-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lexivo-backend

jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        uses: ./.github/actions/lint
      - name: Test
        uses: ./.github/actions/test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: OpenAPI snapshot
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          chmod +x tool/check_openapi_snapshot.sh
          ./tool/check_openapi_snapshot.sh

  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    environment: production
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Image metadata
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG="${GITHUB_SHA}"
          echo "image=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/build
        with:
          target: backend-image
          image-name: ${{ env.IMAGE }}
          image-tag: ${{ env.TAG }}
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push production tags
        run: |
          docker tag "${IMAGE}:${TAG}" "${IMAGE}:production"
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:production"

  build-web:
    name: build-web
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          target: web
          api-base-url: ${{ vars.API_BASE_URL }}
          supabase-url: ${{ vars.SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          sentry-dsn: ${{ secrets.SENTRY_DSN }}
          posthog-api-key: ${{ secrets.POSTHOG_API_KEY }}
          posthog-host: ${{ vars.POSTHOG_HOST }}
          subscription-paywall-enabled: ${{ vars.SUBSCRIPTION_PAYWALL_ENABLED || 'false' }}
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web-production
          path: build/web

  build-android:
    name: build-android
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          target: android-apk
          api-base-url: ${{ vars.API_BASE_URL }}
          sentry-dsn: ${{ secrets.SENTRY_DSN }}
          posthog-api-key: ${{ secrets.POSTHOG_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-production
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: ./.github/actions/build
        with:
          target: android-aab
          api-base-url: ${{ vars.API_BASE_URL }}
          sentry-dsn: ${{ secrets.SENTRY_DSN }}
          posthog-api-key: ${{ secrets.POSTHOG_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab-production
          path: build/app/outputs/bundle/release/app-release.aab

  deploy-production-backend:
    name: deploy-production-backend
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-cloud-run
        with:
          environment: production
          image: ${{ needs.build-and-push.outputs.image }}
          service-name: ${{ vars.CLOUD_RUN_API_SERVICE }}
          worker-service-name: ${{ vars.CLOUD_RUN_WORKER_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          project-id: ${{ vars.GCP_PROJECT_ID }}
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          credentials-json: ${{ secrets.GCP_SA_KEY }}
          env-vars: >-
            DATABASE_URL=${{ secrets.DATABASE_URL }},
            REDIS_URL=${{ secrets.REDIS_URL }},
            CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }},
            SUPABASE_URL=${{ secrets.SUPABASE_URL }},
            SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }},
            SENTRY_DSN=${{ secrets.SENTRY_DSN }},
            POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }},
            POSTHOG_HOST=${{ vars.POSTHOG_HOST }},
            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }},
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }},
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }},
            R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }},
            R2_ENDPOINT_URL=${{ secrets.R2_ENDPOINT_URL }},
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},
            MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}

  deploy-production-web:
    name: deploy-production-web
    runs-on: ubuntu-latest
    needs: [build-web]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flutter-web-production
          path: build/web
      - uses: ./.github/actions/deploy-cloudflare-pages
        with:
          environment: production
          dist-path: build/web
          project-name: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          branch: production
