name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-flutter:
    name: lint-flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Flutter
        uses: ./.github/actions/lint
        with:
          run-flutter: "true"
          run-python: "false"

  lint-python:
    name: lint-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Python
        uses: ./.github/actions/lint
        with:
          run-flutter: "false"
          run-python: "true"

  test-flutter:
    name: test-flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Flutter
        uses: ./.github/actions/test
        with:
          run-flutter: "true"
          run-python: "false"

  test-python:
    name: test-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Python
        uses: ./.github/actions/test
        with:
          run-flutter: "false"
          run-python: "true"

  openapi-snapshot:
    name: openapi-snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check OpenAPI snapshot
        run: |
          chmod +x tool/check_openapi_snapshot.sh
          ./tool/check_openapi_snapshot.sh

  build-backend-image:
    name: build-backend-image
    runs-on: ubuntu-latest
    needs: [lint-python, test-python, openapi-snapshot]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (no push)
        uses: ./.github/actions/build
        with:
          target: backend-image
          image-name: lexivo-backend
          image-tag: pr-${{ github.event.pull_request.number }}-${{ github.sha }}

  workflow-contract:
    name: workflow-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify composites exist
        run: |
          chmod +x tool/check_workflow_contract.sh
          ./tool/check_workflow_contract.sh

  # Soft: optional dart-dio codegen dry-run when generated/ exists (default skip).
  openapi-codegen-soft:
    name: openapi-codegen-soft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Soft codegen check
        run: |
          if [[ -d lib/core/network/generated ]]; then
            echo "generated/ present — full regen not automated yet (TODO(openapi-codegen)); snapshot check is enforced."
          else
            echo "No lib/core/network/generated/ — soft codegen skipped (expected)."
          fi
